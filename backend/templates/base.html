<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dialogue Backend{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
  <nav class="navbar navbar-expand navbar-dark bg-black border-bottom border-secondary">
    <div class="container-fluid">
      <a class="navbar-brand" href="/characters/">Dialogue Backend</a>
      <span class="navbar-text text-secondary">Unity Audio Dialogue Tree Editor</span>
    </div>
  </nav>
  <main class="container py-4">
    {% if messages %}
      <div class="mb-3">
        {% for message in messages %}
          <div class="alert alert-{{ message.tags|default:'secondary' }} mb-2">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
